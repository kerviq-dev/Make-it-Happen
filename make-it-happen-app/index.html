<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Make It Happen Events | Luxury Event Planning, London</title>
    <meta name="description" content="Make It Happen Events — bespoke luxury event planning in London. Weddings, galas, corporate events, and private celebrations crafted with editorial precision." />

    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="/Logo.jpeg" />
    <link rel="apple-touch-icon" href="/Logo.jpeg" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Make It Happen Events" />
    <meta property="og:title" content="Make It Happen Events | Luxury Event Planning, London" />
    <meta property="og:description" content="Bespoke luxury event planning in London. Weddings, galas, corporate events, and private celebrations crafted with editorial precision." />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />

    <!-- Three.js (matches Stitch ANIMATION_4) -->
    <script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>

    <!-- Tailwind CSS (matches all Stitch screens) -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              // ─── CLIENT NEW COLOR PALETTE ───
              // Main Background: Nude / Cream (soft beige, champagne, cream)
              'nude-cream': '#F3E4D6',
              'soft-nude': '#FAF4EE',
              'champagne': '#F8EFE7',
              'cream': '#F3E4D6',
              'seashell': '#FFF8F4',

              // Clean White Highlights
              'pure-white': '#FFFFFF',
              'white': '#FFFFFF',

              // Elegant Pink / Blush (matching flowers and logo)
              'blush-pink': '#D77A91',
              'blush': '#D77A91',
              'rose-pink': '#D77A91',
              'muted-rose': '#D77A91',

              // Luxury / Accent Gold (matching logo)
              'luxury-gold': '#D4A13A',
              'gold': '#D4A13A',
              'primary': '#D4A13A',
              'primary-container': '#B88028',
              'primary-fixed': '#FFE5A3',
              'on-primary': '#FFFFFF',
              'on-primary-container': '#3C2A00',

              // Secondary Background: Black (used occasionally)
              'secondary-black': '#0B0B0B',
              'dark-black': '#0B0B0B',
              'midnight': '#0B0B0B',

              // Text & Neutral Tones
              'text-dark': '#241C1E',
              'text-muted': '#6B5E62',
              'on-surface': '#241C1E',
              'on-surface-variant': '#6B5E62',
              'surface': '#FAF4EE',
              'surface-dim': '#F3E4D6',
              'surface-bright': '#FFFFFF',
              'surface-container-lowest': '#FFFFFF',
              'surface-container-low': '#FAF4EE',
              'surface-container': '#F3E4D6',
              'surface-container-high': '#EBDACE',
              'surface-container-highest': '#E2CEBF',
              'background': '#F3E4D6',
              'on-background': '#241C1E',

              'outline': '#D77A91',
              'outline-variant': '#E8CBD2',
              'error': '#BA1A1A',
            },
            fontFamily: {
              'display-lg': ['"Playfair Display"', 'Georgia', 'serif'],
              'display-lg-mobile': ['"Playfair Display"', 'Georgia', 'serif'],
              'headline-md': ['"Playfair Display"', 'Georgia', 'serif'],
              'headline-sm': ['"Playfair Display"', 'Georgia', 'serif'],
              'body-lg': ['Inter', 'system-ui', 'sans-serif'],
              'body-md': ['Inter', 'system-ui', 'sans-serif'],
              'label-caps': ['Inter', 'system-ui', 'sans-serif'],
            },
            fontSize: {
              'display-lg': ['72px', { lineHeight: '80px', letterSpacing: '-0.02em', fontWeight: '700' }],
              'display-lg-mobile': ['40px', { lineHeight: '48px', letterSpacing: '-0.01em', fontWeight: '700' }],
              'headline-md': ['32px', { lineHeight: '40px', fontWeight: '600' }],
              'headline-sm': ['24px', { lineHeight: '32px', fontWeight: '600' }],
              'body-lg': ['18px', { lineHeight: '28px', fontWeight: '400' }],
              'body-md': ['16px', { lineHeight: '24px', fontWeight: '400' }],
              'label-caps': ['12px', { lineHeight: '16px', letterSpacing: '0.1em', fontWeight: '600' }],
            },
            borderRadius: {
              'DEFAULT': '0.125rem',
              'lg': '0.25rem',
              'xl': '0.5rem',
              'full': '9999px',
            },
            spacing: {
              'margin-desktop': '80px',
              'margin-mobile': '24px',
              'gutter': '32px',
              'section-gap': '160px',
              'stack-sm': '8px',
              'stack-md': '16px',
              'stack-lg': '32px',
            },
            maxWidth: {
              'site': '1440px',
            },
          },
        },
      }
    </script>
  </head>
  <body class="dark bg-background text-on-surface">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
